name: NPM Lint

on:
  pull_request:
    types: [opened, synchronize] # Trigger on PR opened and when changes are pushed to the PR

permissions:
  contents: read
  pull-requests: read

jobs:
  npm-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check changed files
        id: changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: .github/filters/required-checks.yml

      - name: Skip filtered changes
        if: steps.changes.outputs.run != 'true'
        run: echo "Skipping npm lint because this PR only changes files excluded by .github/filters/required-checks.yml."

      - name: Set up Node.js
        if: steps.changes.outputs.run == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.x"

      - name: Upgrade npm to v11
        if: steps.changes.outputs.run == 'true'
        run: cd "$RUNNER_TEMP" && npm install -g npm@11
        env:
          NPM_CONFIG_USERCONFIG: /dev/null

      - name: Install dependencies
        if: steps.changes.outputs.run == 'true'
        run: npm install
        working-directory: src

      - name: Run npm lint
        if: steps.changes.outputs.run == 'true'
        env:
          TERM: xterm
        run: npm run lint
        working-directory: src
