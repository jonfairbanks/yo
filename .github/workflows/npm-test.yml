name: NPM Test

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  npm-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"

      - name: Install dependencies
        run: npm ci
        working-directory: src

      - name: Run npm tests
        run: npm test
        working-directory: src
