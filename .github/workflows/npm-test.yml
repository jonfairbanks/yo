name: NPM Test

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  npm-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check changed files
        id: changes
        uses: dorny/paths-filter@v4
        with:
          predicate-quantifier: every
          filters: .github/filters/required-checks.yml

      - name: Skip filtered changes
        if: steps.changes.outputs.run != 'true'
        run: echo "Skipping npm tests because this PR only changes files excluded by .github/filters/required-checks.yml."

      - name: Set up Node.js
        if: steps.changes.outputs.run == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"

      - name: Upgrade npm to v11
        if: steps.changes.outputs.run == 'true'
        run: cd "$RUNNER_TEMP" && npm install -g npm@11
        env:
          NPM_CONFIG_USERCONFIG: /dev/null

      - name: Install dependencies
        if: steps.changes.outputs.run == 'true'
        run: npm ci
        working-directory: src

      - name: Run npm tests
        if: steps.changes.outputs.run == 'true'
        run: npm test
        working-directory: src
