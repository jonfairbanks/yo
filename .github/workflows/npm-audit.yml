name: NPM Audit

on:
  pull_request:
    types: [opened, synchronize] # Trigger on PR opened and when changes are pushed to the PR

permissions:
  contents: read
  pull-requests: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check changed files
        id: changes
        uses: dorny/paths-filter@v4
        with:
          predicate-quantifier: every
          filters: .github/filters/required-checks.yml

      - name: Skip filtered changes
        if: steps.changes.outputs.run != 'true'
        run: echo "Skipping npm audit because this PR only changes files excluded by .github/filters/required-checks.yml."

      - name: Set up Node.js
        if: steps.changes.outputs.run == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"

      - name: Upgrade npm to v11
        if: steps.changes.outputs.run == 'true'
        run: npm install -g npm@11

      - name: Install dependencies
        if: steps.changes.outputs.run == 'true'
        run: npm install
        working-directory: src

      - name: Run npm audit
        if: steps.changes.outputs.run == 'true'
        run: npm audit --audit-level=high
        working-directory: src
