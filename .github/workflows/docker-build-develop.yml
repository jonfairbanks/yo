name: "CI - Development"

on:
  push:
    branches:
      - "develop"
      - "main"
  pull_request:
    branches:
      - "develop"
      - "main"
env:
  TERM: "xterm"
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

jobs:
  configure:
    name: Configure
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Setup deployment variables
        id: setup-vars
        run: |
          BRANCH_NAME=$(echo "${{ github.ref }}" | sed 's|refs/heads/||')
          echo "Branch: $BRANCH_NAME"
          if [ "$BRANCH_NAME" = "develop" ]; then
            echo "Using Development"
            echo "environment=development" >> $GITHUB_OUTPUT
            echo "aws_key=${{ secrets.aws_access_key_id }}" >> $GITHUB_OUTPUT
            echo "aws_secret=${{ secrets.aws_secret_access_key }}" >> $GITHUB_OUTPUT
          elif [ "$BRANCH_NAME" = "main" ]; then
            echo "Using Production"
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "aws_key=${{ secrets.aws_access_key_id }}" >> $GITHUB_OUTPUT
            echo "aws_secret=${{ secrets.aws_secret_access_key }}" >> $GITHUB_OUTPUT
          fi

  node-lint:
    name: Lint Node.js
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"

      - name: Install dependencies
        run: npm ci
        working-directory: src

      - name: Lint Code
        run: npm run lint
        working-directory: src

  node-audit:
    name: Critical Vulnerability Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"

      - name: Install dependencies
        run: npm ci
        working-directory: src

      - name: Check for critical vulnerabilities
        run: npm audit --audit-level=critical
        working-directory: src

  docker-build:
    name: Docker Build
    environment: development
    needs: [node-lint, node-audit]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Define sha_short
        id: vars
        run: echo "::set-output name=sha_short::$(git rev-parse --short HEAD)"

      - name: Set up QEMU
        id: setup-qemu
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Docker image(s)
        id: docker-build
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: ./src
          platforms: linux/amd64 # TODO: Re-add `linux/arm64`
          file: ./src/Dockerfile
          push: ${{ github.event_name == 'push' }}
          provenance: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/yo-url:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notify Slack
        uses: act10ns/slack@v2
        with:
          status: ${{ job.status }}
          steps: ${{ toJson(steps) }}
        if: always() && github.event_name == 'push'
