name: "CI - Development"

on:
  push:
    branches:
      - "develop"
      - "main"
  pull_request:
    branches:
      - "develop"
      - "main"
permissions: {}

env:
  TERM: "xterm"

jobs:
  node-lint:
    name: Lint Node.js
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.x"

      - name: Install dependencies
        run: npm ci
        working-directory: src

      - name: Lint Code
        run: npm run lint
        working-directory: src

  node-audit:
    name: Critical Vulnerability Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.x"

      - name: Install dependencies
        run: npm ci
        working-directory: src

      - name: Check for critical vulnerabilities
        run: npm audit --audit-level=critical
        working-directory: src

  docker-build:
    name: Docker Build
    needs: [node-lint, node-audit]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Define sha_short
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Compute safe Docker tag
        id: image-tag
        run: |
          RAW_REF="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          SAFE_REF="$(echo "${RAW_REF}" | tr '/:@' '-' | tr -cd '[:alnum:]._-')"
          if [ -z "${SAFE_REF}" ]; then
            SAFE_REF="${GITHUB_SHA::12}"
          fi
          echo "value=${SAFE_REF}" >> "${GITHUB_OUTPUT}"

      - name: Compute Docker image tags
        id: image-tags
        run: |
          TAGS="ghcr.io/${GITHUB_REPOSITORY_OWNER}/yo-url:${{ steps.image-tag.outputs.value }}"
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_NAME}" = "main" ]; then
            TAGS="${TAGS}"$'\n'"ghcr.io/${GITHUB_REPOSITORY_OWNER}/yo-url:latest"
          fi
          {
            echo "value<<EOF"
            echo "${TAGS}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Docker image(s)
        id: docker-build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: ./src
          platforms: linux/amd64 # TODO: Re-add `linux/arm64`
          file: ./src/Dockerfile
          push: ${{ github.event_name == 'push' }}
          provenance: false
          tags: ${{ steps.image-tags.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        uses: act10ns/slack@d96404edccc6d6467fc7f8134a420c851b1e9054 # v2.2.0
        with:
          status: ${{ job.status }}
          steps: ${{ toJson(steps) }}
        if: always() && github.event_name == 'push'
